name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['www/**','package.json','capacitor.config.json','.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Set config URL
        run: |
          OWNER=${GITHUB_REPOSITORY%/*}; REPO=${GITHUB_REPOSITORY#*/}
          sed -i "s#__CFG__#https://${OWNER}.github.io/${REPO}/config.json#g" www/index.html
          cp config.json www/config.json
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - name: Fixed signing key and version
        run: |
          mkdir -p ~/.android
          base64 -d keystore.b64 > ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: المؤذن v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
