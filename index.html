<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#12223d;--mut:#6b7a92;--acc:#e8a200;--ok:#1b9a68;--bad:#d24545;--hd:#0d2342;--rad:10px;--line:color-mix(in srgb,var(--ink) 15%,transparent);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media (min-width:1600px){html{font-size:18px}}@media (min-width:2400px){html{font-size:26px}}@media (min-width:3200px){html{font-size:34px}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6;font-size:1rem;-webkit-font-smoothing:antialiased}
.sim{background:var(--acc);color:#12223d;text-align:center;font-size:.8rem;font-weight:700;padding:.35rem .6rem}
.wrap{max-width:62rem;margin:0 auto;padding:.9rem}

.hero{background:linear-gradient(135deg,var(--hd),color-mix(in srgb,var(--hd) 60%,var(--acc)));color:#fff;border:0}

.big{font-size:1.7rem;font-weight:800;direction:ltr;text-align:right}
.row{display:flex;gap:.6rem;flex-wrap:wrap}.row>*{flex:1 1 9rem}
input,select{width:100%;padding:.55rem;border:1px solid var(--line);border-radius:calc(var(--rad)*.6);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:.5rem}
input[type=checkbox]{width:auto;margin:0}input[type=color]{padding:0;height:2.2rem;min-width:3rem}
td input,td select{margin:0;min-width:5.5rem}td input[type=checkbox]{min-width:0}
button{font:inherit;font-weight:700;padding:.5rem .9rem;border:0;border-radius:calc(var(--rad)*.6);background:var(--hd);color:#fff;cursor:pointer}
button.a{background:var(--acc);color:#12223d}button.g{background:var(--ok)}button.r{background:var(--bad)}button.l{background:transparent;color:inherit;border:1px solid var(--line)}
.hd button.l{border-color:#fff5;color:#fff}
.tab{background:var(--card);color:var(--ink);border:1px solid var(--line)}.tab.on{background:var(--acc);color:#12223d;border-color:var(--acc)}
.nav{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.3rem}.nav button{white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:.5rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.muted{color:var(--mut);font-size:.82rem}.err{color:var(--bad);font-size:.82rem;min-height:1.2rem}.okk{color:var(--ok);font-size:.82rem}
.pill{display:inline-block;padding:0 .6rem;border-radius:99px;font-size:.75rem;background:var(--line)}
.pulse{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--ok);margin-inline-end:.4rem;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.info{background:var(--bg);border:1px dashed var(--line);border-radius:var(--rad);padding:.6rem;margin-bottom:.5rem;word-break:break-all}
ol{margin:0 0 .6rem;padding-inline-start:1.3rem}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-inline-end:.4rem}
#miner{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 0,#10284a,#050a14);color:#e8f1ff;display:flex;flex-direction:column;gap:.9rem;padding:calc(.9rem + env(safe-area-inset-top,0px)) .9rem calc(.9rem + env(safe-area-inset-bottom,0px));overflow:auto}
.mh{display:flex;gap:.6rem;align-items:center;font-size:1.1rem}
.mg{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;justify-content:center}
.mg svg{width:min(55vw,16rem)}
.ms{display:grid;grid-template-columns:repeat(2,minmax(7rem,1fr));gap:.5rem;flex:1;min-width:15rem}
.ms div{background:#ffffff12;border-radius:var(--rad);padding:.6rem;font-size:.8rem;color:#9fb3d1}
.ms b{display:block;font-size:1.2rem;color:#fff;direction:ltr;text-align:right}
#mlog{flex:1;min-height:7rem;margin:0;background:#0007;color:#5dffa8;font:.75rem/1.5 ui-monospace,Menlo,monospace;padding:.7rem;border-radius:var(--rad);overflow:hidden;direction:ltr;text-align:left;white-space:pre}
button,.btn{transition:transform .15s ease,box-shadow .2s ease,filter .2s ease}
button:hover,.btn:hover{filter:brightness(1.08);box-shadow:0 .25rem .8rem #0003}
button:active,.btn:active{transform:scale(.96)}
.btn{display:inline-block;text-align:center;text-decoration:none;font-weight:700;padding:.5rem .9rem;border-radius:calc(var(--rad)*.6);background:var(--hd);color:#fff}.btn.a{background:var(--acc);color:#12223d}
.page{animation:fi .25s ease}@keyframes fi{from{opacity:0;transform:translateY(.4rem)}}
#toast{position:fixed;inset-inline:0;bottom:calc(1rem + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;background:var(--ok);color:#fff;padding:.6rem 1.1rem;border-radius:99px;z-index:200;opacity:0;pointer-events:none;transform:translateY(1rem);transition:.3s}#toast.on{opacity:1;transform:none}
.form{max-width:28rem;margin-inline:auto;margin-bottom:.8rem}
@media (prefers-reduced-motion:reduce){.page{animation:none}button,.btn,#toast{transition:none}}
</style>
