<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0c1f1a"><title>المؤذن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet"><style>:root{--a:#c9a961;--bg:#0c1f1a;--c:#14332c;--t:#e6dfc8;--f:#ffffff0d;--l:#ffffff14}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{background-color:var(--bg,#0c1f1a);margin:0}body{color:var(--t);font-family:Cairo,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 90px}
h1{text-align:center;color:var(--a);margin:16px 0 6px;font:700 28px Amiri,serif}h1:after{content:'';display:block;width:80px;height:1px;margin:6px auto 0;background:linear-gradient(90deg,transparent,var(--a),transparent)}
.card,.hero{background:var(--c);border:1px solid var(--l);border-radius:20px;margin:12px 14px;padding:14px;box-shadow:0 4px 14px #0003}.hero{text-align:center;padding:18px;border-color:var(--a)}.hero small{opacity:.75}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid var(--l);font-size:17px}.row:last-child{border:0}.row.n{color:var(--a);background:var(--f);border:1px solid var(--a);border-radius:12px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--l)}nav button{flex:1;background:0;border:0;color:var(--t);padding:10px 2px;font:12px Cairo,sans-serif;opacity:.6}nav button.on{color:var(--a);opacity:1;font-weight:700}
button.b{background:var(--a);color:var(--bg);border:0;border-radius:12px;padding:9px 14px;font:700 14px Cairo,sans-serif}select,input{background:var(--f);color:var(--t);border:1px solid var(--l);border-radius:12px;padding:10px 14px;font:14px Cairo,sans-serif;width:100%;margin:5px 0}option{color:#111}
#u{position:fixed;top:10px;left:10px;right:10px;background:var(--a);color:var(--bg);padding:12px;border-radius:14px;z-index:9;display:none}#p{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:8}#p div{background:var(--bg);border:1px solid var(--a);border-radius:24px;padding:36px 44px;text-align:center;font:700 36px Amiri,serif;color:var(--a)}
.big{font:700 40px Cairo,sans-serif;text-align:center;color:var(--a)}.gh{display:flex;justify-content:space-between;font:700 20px Amiri,serif;color:var(--a);padding:4px}.zi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--l);font:20px/2 Amiri,serif}.zi.dn{opacity:.4}.zi button{min-width:52px;font-size:18px}</style></head><body>
<div id="u"></div><div id="p" onclick="this.style.display='none'"><div id="pt"></div></div>
<h1 id="ti">المؤذن</h1><div id="v"></div>
<nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s);const CFG='__CFG__'.startsWith('__')?'config.json':'__CFG__';let C={},T={},tab='p',S=Object.assign({mode:'auto',country:'Saudi Arabia',city:'Riyadh',voice:'haidan',off:{},my:[],method:4},JSON.parse(localStorage.s||'{}'));
const save=()=>localStorage.s=JSON.stringify(S),N={Fajr:'الفجر',Sunrise:'الشروق',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
const CT={'Saudi Arabia':'Riyadh','Egypt':'Cairo','UAE':'Dubai','Kuwait':'Kuwait City','Qatar':'Doha','Jordan':'Amman','Iraq':'Baghdad','Morocco':'Rabat','Algeria':'Algiers','Tunisia':'Tunis','Yemen':'Sanaa','Oman':'Muscat','Bahrain':'Manama','Turkey':'Ankara','Palestine':'Jerusalem','Sudan':'Khartoum','Libya':'Tripoli','Lebanon':'Beirut','Syria':'Damascus'};
async function cfg(f){try{const n=await(await fetch(CFG+'?t='+Date.now(),{cache:'no-store'})).json();if(S.ver&&S.ver!==n.version){const u=$('#u');u.innerHTML='🔔 تحديث جديد '+n.version+'<br>'+(n.updateMsg||'');u.style.display='block';setTimeout(()=>u.style.display='none',9000)}S.ver=n.version;save();C=n;ui()}catch(e){}}
function ui(){const r=document.documentElement.style;applyTh();$('#ti').textContent=C.appName;document.title=C.appName;
const f=C.features||{},m=[['p','🕌','الصلاة'],f.qibla&&['q','🧭','القبلة'],f.azkar&&['z','📿','الأذكار'],f.quran&&['r','📖','القرآن'],['v','🎙','الأصوات'],['s','⚙️','الإعدادات']].filter(Boolean);
$('#nv').innerHTML=m.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';ui()">${x[1]}<br>${x[2]}</button>`).join('');V[tab]()}
async function getT(){let u;if(S.mode=='auto'){const p=await new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(x=>r(x.coords),()=>r(0)):r(0));if(p){S.lat=p.latitude;S.lon=p.longitude;u=`timings?latitude=${p.latitude}&longitude=${p.longitude}&method=${S.method}`}}
u=u||`timingsByCity?city=${S.city}&country=${S.country}&method=${S.method}`;try{const D=(await(await fetch('https://api.aladhan.com/v1/'+u)).json()).data;T=D.timings;if(S.mode!='auto'||!S.lat){S.lat=D.meta.latitude;S.lon=D.meta.longitude;save()};localStorage.T=JSON.stringify(T)}catch(e){T=JSON.parse(localStorage.T||'{}')}if(tab=='p')ui();sched()}
const tm=k=>{const[h,m]=(T[k]||'0:0').split(':').map(Number);const d=(h*60+m+(+S.off[k]||0)+1440)%1440;return[Math.floor(d/60),d%60]},fm=a=>(a[0]%12||12)+':'+String(a[1]).padStart(2,'0')+' '+(a[0]<12?'ص':'م'),hms=x=>[Math.floor(x/3600),Math.floor(x%3600/60),x%60].map(v=>String(v).padStart(2,'0')).join(':'),IC={Fajr:'🌌',Sunrise:'🌅',Dhuhr:'☀️',Asr:'🌤',Maghrib:'🌇',Isha:'🌙'};let zo=-1,zc={},cl=0;const TH={black:{bg:'#0b0b0c',c:'#18181a',t:'#d8d4c8',a:'#c9a961',f:'#ffffff0d',l:'#ffffff14'},sand:{bg:'#efe7d2',c:'#e4d9bb',t:'#2e2b22',a:'#8a6a1c',f:'#0000000a',l:'#0000001f'}};
function applyTh(){const r=document.documentElement.style,t=TH[S.th]||{bg:C.bg||'#0c1f1a',c:'#14332c',t:C.text||'#e6dfc8',a:C.accent||'#c9a961',f:'#ffffff0d',l:'#ffffff14'};for(const k in t)r.setProperty('--'+k,t[k]);try{document.querySelector('meta[name=theme-color]').content=t.bg;const B=Capacitor.Plugins.StatusBar;B.setBackgroundColor({color:t.bg});B.setStyle({style:S.th=='sand'?'LIGHT':'DARK'})}catch(e){}}
function qgeo(){const r=x=>x*Math.PI/180,la=r(S.lat||24.7),lo=r(S.lon||46.7),k=r(21.4225),ko=r(39.8262),dl=ko-lo;const b=(Math.atan2(Math.sin(dl)*Math.cos(k),Math.cos(la)*Math.sin(k)-Math.sin(la)*Math.cos(k)*Math.cos(dl))*180/Math.PI+360)%360,a=Math.sin((k-la)/2)**2+Math.cos(la)*Math.cos(k)*Math.sin(dl/2)**2;return[b,Math.round(12742*Math.asin(Math.sqrt(a)))]}function nx(){const n=new Date(),c=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();let b=null;for(const k in N){const t=tm(k);let d=t[0]*3600+t[1]*60-c;if(d<=0)d+=86400;if(!b||d<b[1])b=[k,d]}return b}
const V={p(){const b=nx();$('#v').innerHTML=`<div class="hero"><small>${new Date().toLocaleDateString('ar-SA-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'})}</small><div>الصلاة القادمة: ${N[b[0]]}</div><div class="big" id="cd">${hms(b[1])}</div><small>${S.mode=='auto'?'📍 الموقع تلقائي':S.city+'، '+S.country}</small></div><div class="card">`+Object.keys(N).map(k=>`<div class="row ${k==b[0]?'n':''}"><span>${IC[k]} ${N[k]}</span><span>${T[k]?fm(tm(k)):'--'}</span></div>`).join('')+`</div>`},
s(){$('#v').innerHTML=`<div class="card"><b>التوقيت</b><select onchange="S.mode=this.value;save();getT();ui()"><option value=auto ${S.mode=='auto'?'selected':''}>تلقائي (GPS)</option><option value=manual ${S.mode!='auto'?'selected':''}>يدوي</option></select>
<select onchange="S.country=this.value;S.city=CT[this.value];S.mode='manual';save();getT();ui()">${Object.keys(CT).map(k=>`<option ${k==S.country?'selected':''}>${k}</option>`)}</select><input value="${S.city}" onchange="S.city=this.value;S.mode='manual';save();getT()" placeholder="المدينة">
<select onchange="S.method=this.value;save();getT()">${[[4,'أم القرى'],[5,'الهيئة المصرية'],[3,'رابطة العالم الإسلامي'],[2,'ISNA'],[1,'كراتشي']].map(x=>`<option value=${x[0]} ${S.method==x[0]?'selected':''}>${x[1]}</option>`)}</select></div>
<div class="card"><b>ضبط يدوي بالدقائق</b>${Object.keys(N).map(k=>`<div class="row">${N[k]}<input type=number style="width:80px" value="${S.off[k]||0}" onchange="S.off['${k}']=this.value;save()"></div>`).join('')}</div>
<div class="card"><b>المظهر</b><select onchange="S.th=this.value;save();ui()"><option value="admin" ${!S.th||S.th=='admin'?'selected':''}>أخضر ليلي مريح</option><option value="black" ${S.th=='black'?'selected':''}>أسود هادئ</option><option value="sand" ${S.th=='sand'?'selected':''}>بيج نهاري</option></select></div><div class="card"><button class="b" onclick="Notification.requestPermission()">تفعيل الإشعارات</button></div>`},
v(){const L=[...C.voices,...S.my];$('#v').innerHTML=`<div class="card"><b>أصوات الأذان</b>`+L.map((x,i)=>`<div class="row"><span>${x.name}${x.locked?' 🔒':''}</span><span><button class="b" onclick="play('${x.url}')">▶</button> <button class="b" onclick="dl('${x.url}')">⬇</button> <button class="b" onclick="S.voice='${x.id}';save();ui()">${S.voice==x.id?'✔':'اختيار'}</button></span></div>`).join('')+`</div>
<div class="card"><b>إضافة صوت شيخ</b><input id=an placeholder="اسم الشيخ"><input id=au placeholder="رابط ملف mp3"><button class="b" onclick="S.my.push({id:'u'+Date.now(),name:an.value,url:au.value});save();ui()">إضافة</button></div>`},
z(){$('#v').innerHTML=C.azkar.map((g,i)=>`<div class="card"><div class="gh" onclick="zo=zo==${i}?-1:${i};ui()">${g.title}<span>${zo==i?'▲':'▼'}</span></div>`+(zo==i?g.items.map((x,j)=>{x=typeof x=='string'?{t:x,n:1}:x;const k=i+'_'+j,r=zc[k]??x.n;return `<div class="zi ${r?'':'dn'}"><div>${x.t}</div><button class="b" onclick="zc['${k}']=${Math.max(0,r-1)};ui()">${r||'✔'}</button></div>`}).join(''):'')+`</div>`).join('')},
async r(){$('#v').innerHTML=`<div class="card"><select id=rc>${C.reciters.map(x=>`<option value=${x.id}>${x.name}</option>`)}</select><audio id=au2 controls style="width:100%"></audio></div><div id=sl class="card">...</div>`;
const d=(await(await fetch('https://api.alquran.cloud/v1/surah')).json()).data;$('#sl').innerHTML=d.map(s=>`<div class="row"><span onclick="surah(${s.number})">${s.number}. ${s.name}</span><button class="b" onclick="au2.src='https://cdn.islamic.network/quran/audio-surah/128/'+rc.value+'/${s.number}.mp3';au2.play()">▶</button></div>`).join('')},
q(){const[b,km]=qgeo();S.qb=b;let t='';for(let i=0;i<36;i++){const m=i%9==0;t+=`<line x1="150" y1="${m?16:14}" x2="150" y2="${m?32:24}" stroke="var(--a)" stroke-width="${m?3:1.5}" opacity="${m?1:.55}" transform="rotate(${i*10} 150 150)"/>`}
[['N',0],['E',90],['S',180],['W',270]].forEach(x=>t+=`<text x="150" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="${x[1]?'var(--t)':'#d4705f'}" transform="rotate(${x[1]} 150 150)">${x[0]}</text>`);
$('#v').innerHTML=`<div class="card" style="text-align:center"><svg id="cs" viewBox="0 0 300 300" style="width:min(88vw,330px)"><circle cx="150" cy="150" r="142" fill="var(--bg)" stroke="var(--a)" stroke-width="3"/><circle cx="150" cy="150" r="104" fill="none" stroke="var(--l)" stroke-width="1"/><g id="dial" style="transform-origin:150px 150px">${t}<g transform="rotate(${b} 150 150)"><line x1="150" y1="150" x2="150" y2="62" stroke="var(--a)" stroke-width="3" stroke-dasharray="5 4"/><text x="150" y="54" text-anchor="middle" font-size="28">🕋</text></g></g><path d="M141 0L159 0L150 20Z" fill="var(--a)"/><circle cx="150" cy="150" r="7" fill="var(--a)"/></svg><div class="big">${Math.round(b)}°</div><div id="qs" style="font-size:18px;min-height:28px">حرّك الجوال</div><div style="font-size:13px;opacity:.7;margin-top:6px">القبلة ${Math.round(b)}° من الشمال · تبعد ${km} كم عن الكعبة<br>للمعايرة حرّك الجوال على شكل ٨ وابتعد عن المعادن</div><button class="b" id="qbtn" style="display:none;margin-top:10px" onclick="comp()">تشغيل البوصلة</button></div>`;if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)$('#qbtn').style.display='inline-block';else comp()},
async surah(n){}};
async function surah(n){const d=(await(await fetch('https://api.alquran.cloud/v1/surah/'+n+'/quran-uthmani')).json()).data;$('#v').innerHTML=`<div class="card"><button class="b" onclick="ui()">رجوع</button><h2>${d.name}</h2><div style="font-size:24px;line-height:2.2">${d.ayahs.map(a=>a.text+' ﴿'+a.numberInSurah+'﴾').join(' ')}</div></div>`}
async function comp(){if(cl)return;cl=1;try{if(DeviceOrientationEvent.requestPermission&&(await DeviceOrientationEvent.requestPermission())!='granted'){cl=0;return}}catch(x){cl=0;return}const bt=$('#qbtn');if(bt)bt.style.display='none';let sm=null,vb=0;const R=Math.PI/180;
const h=e=>{let hd=e.webkitCompassHeading;if(hd==null){if(e.alpha==null||(!e.absolute&&e.type!='deviceorientationabsolute'))return;const x=e.beta*R,y=e.gamma*R,z=e.alpha*R,cY=Math.cos(y),sY=Math.sin(y),sZ=Math.sin(z),cZ=Math.cos(z),sX=Math.sin(x),cX=Math.cos(x);hd=Math.atan2(-cZ*sY-sZ*sX*cY,-sZ*sY+cZ*sX*cY)/R;hd=(hd+360)%360}
sm=sm==null?hd:(sm+(((hd-sm+540)%360)-180)*.25+360)%360;const dl=document.getElementById('dial');if(!dl)return;dl.style.transform=`rotate(${-sm}deg)`;const d=((S.qb-sm+540)%360)-180,ok=Math.abs(d)<3;document.getElementById('qs').textContent=ok?'✅ أنت باتجاه القبلة':(d>0?'↻ در يميناً ':'↺ در يساراً ')+Math.abs(Math.round(d))+'°';document.getElementById('cs').style.filter=ok?'drop-shadow(0 0 10px #6fcf97)':'none';if(ok&&Date.now()-vb>2500){vb=Date.now();navigator.vibrate&&navigator.vibrate(60)}};
addEventListener('ondeviceorientationabsolute'in window?'deviceorientationabsolute':'deviceorientation',h,true)}
function sched(){const L=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!L)return;const ks=Object.keys(N).filter(k=>k!='Sunrise');
L.requestPermissions().then(()=>L.cancel({notifications:ks.map((k,i)=>({id:i+1}))}).catch(()=>{})).then(()=>{const n=[];ks.forEach((k,i)=>{const t=tm(k),d=new Date();d.setHours(t[0],t[1],0,0);if(d>new Date())n.push({id:i+1,title:C.appName,body:'حان وقت صلاة '+N[k],schedule:{at:d,allowWhileIdle:true}})});if(n.length)L.schedule({notifications:n})})}
async function src(u){const m=await caches.match(u);return m?URL.createObjectURL(await m.blob()):u}
async function play(u){const a=new Audio(await src(u));a.play().catch(()=>{});return a}
async function dl(u){const c=await caches.open('aud');await c.add(u);alert('تم التنزيل')}
function pop(i){const p=$('#p');$('#pt').textContent=i.t;p.style.display='flex';i.a?play(i.a):speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(i.t),{lang:'ar'}));if(Notification.permission=='granted')new Notification(i.t);setTimeout(()=>p.style.display='none',5000)}
let di=0,lastD=Date.now(),lf='';
setInterval(()=>{const e=$('#cd');if(e)e.textContent=hms(nx()[1]);const n=new Date(),k=n.getHours()+':'+n.getMinutes();
if(C.dhikr&&C.dhikr.enabled&&Date.now()-lastD>C.dhikr.everyMin*6e4){lastD=Date.now();pop(C.dhikr.items[di++%C.dhikr.items.length])}
for(const p in N){if(p=='Sunrise')continue;const t=tm(p);if(t[0]+':'+t[1]==k&&lf!=p+k){lf=p+k;const v=[...C.voices,...S.my].find(x=>x.id==S.voice)||C.voices[0];play(v.url);if(Notification.permission=='granted')new Notification('حان وقت صلاة '+N[p])}}},1000);
setInterval(cfg,60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
T=JSON.parse(localStorage.T||'{}');cfg().then(getT);
</script></body></html>
